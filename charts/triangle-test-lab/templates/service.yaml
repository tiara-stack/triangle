apiVersion: v1
kind: Service
metadata:
  name: {{ include "triangle-test-lab.name" . }}-service
  labels:
    {{- include "triangle-test-lab.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "triangle-test-lab.selectorLabels" . | nindent 4 }}
