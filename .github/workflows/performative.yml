name: Performative defect detection

permissions: {}

on:
  workflow_dispatch:

jobs:
  performative:
    name: Known defects should fail direct and UI assertions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: node node_modules/@playwright/test/cli.js install --with-deps chromium

      - name: Report Qase configuration status
        env:
          QASE_MODE: ${{ vars.QASE_TESTOPS_PROJECT != '' && (secrets.QASE_TESTOPS_API_TOKEN != '' || (secrets.QASE_VITEST_API_TOKEN != '' && secrets.QASE_PLAYWRIGHT_API_TOKEN != '')) && 'testops' || 'off' }}
        run: |
          if [[ "$QASE_MODE" == "testops" ]]; then
            echo "Qase TestOps reporting is enabled."
          else
            echo "Qase reporting is disabled. Set QASE_TESTOPS_PROJECT and either QASE_TESTOPS_API_TOKEN or both QASE_VITEST_API_TOKEN and QASE_PLAYWRIGHT_API_TOKEN."
          fi

      - name: Run defect-detecting assertions (should fail while defects remain)
        env:
          QASE_MODE: ${{ vars.QASE_TESTOPS_PROJECT != '' && (secrets.QASE_TESTOPS_API_TOKEN != '' || (secrets.QASE_VITEST_API_TOKEN != '' && secrets.QASE_PLAYWRIGHT_API_TOKEN != '')) && 'testops' || 'off' }}
          QASE_TESTOPS_PROJECT: ${{ vars.QASE_TESTOPS_PROJECT }}
          QASE_TESTOPS_API_TOKEN: ${{ vars.QASE_TESTOPS_PROJECT != '' && secrets.QASE_TESTOPS_API_TOKEN != '' && secrets.QASE_TESTOPS_API_TOKEN || '' }}
          QASE_VITEST_API_TOKEN: ${{ vars.QASE_TESTOPS_PROJECT != '' && (secrets.QASE_TESTOPS_API_TOKEN != '' || (secrets.QASE_VITEST_API_TOKEN != '' && secrets.QASE_PLAYWRIGHT_API_TOKEN != '')) && secrets.QASE_VITEST_API_TOKEN || '' }}
          QASE_PLAYWRIGHT_API_TOKEN: ${{ vars.QASE_TESTOPS_PROJECT != '' && (secrets.QASE_TESTOPS_API_TOKEN != '' || (secrets.QASE_VITEST_API_TOKEN != '' && secrets.QASE_PLAYWRIGHT_API_TOKEN != '')) && secrets.QASE_PLAYWRIGHT_API_TOKEN || '' }}
          QASE_TESTOPS_RUN_DESCRIPTION: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: pnpm test:performative
